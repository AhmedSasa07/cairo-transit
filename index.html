<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('egymetro_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0A0A0B';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F4F4F5';
          }
          var savedLang = localStorage.getItem('egymetro_lang');
          if (savedLang === 'en') {
            document.documentElement.dir = 'ltr';
            document.documentElement.lang = 'en';
          } else {
            document.documentElement.dir = 'rtl';
            document.documentElement.lang = 'ar';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html {
        background-color: #0A0A0B;
        touch-action: pan-y;
      }
      html:not(.dark) {
        background-color: #F4F4F5;
      }
      body {
        background-color: inherit;
        margin: 0;
        touch-action: pan-y;
      }
      #loading-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        gap: 16px;
        background-color: #F4F4F5;
        color: #0F172A;
      }
      html[lang="en"] #loading-placeholder,
      html[dir="ltr"] #loading-placeholder {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
        font-weight: 500;
      }
      html[lang="en"],
      html[dir="ltr"] {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      }
      html.dark #loading-placeholder {
        background-color: #0A0A0B;
        color: #FFFFFF;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#DC2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Egy Metro" />
    <meta name="description" content="Navigate Cairo's metro, monorail, LRT and BRT system with confidence. Route finder, ticket prices, line overviews, and subscriptions guide." />
    
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Non-blocking Google Fonts with instant local fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    </noscript>
    
    <title>مترو مصر | Egy Metro Guide</title>
  </head>
  <body class="bg-[#F4F4F5] dark:bg-[#0A0A0B] text-slate-900 dark:text-[#F4F4F5] antialiased min-h-screen">
    <div id="root">
      <!-- Loading placeholder while bundle parses so screen is never blank white -->
      <div id="loading-placeholder">
        <div style="width:64px; height:64px; border-radius:20px; background:linear-gradient(135deg, #DC2626, #991B1B); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 28px rgba(220,38,38,0.4); border:2px solid rgba(255,255,255,0.2);">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="16" rx="2"/>
            <path d="M4 11h16"/>
            <path d="M12 3v8"/>
            <path d="m8 19-2 3"/>
            <path d="m16 19 2 3"/>
            <circle cx="8" cy="15" r="1" fill="white"/>
            <circle cx="16" cy="15" r="1" fill="white"/>
          </svg>
        </div>
        <div style="text-align:center;">
          <h2 style="margin:0; font-size:19px; font-weight:800; letter-spacing:-0.5px;">مترو مصر • Egy Metro Guide</h2>
          <p style="margin:4px 0 0; font-size:13px; color:#94A3B8;">دليل مترو القاهرة والمونوريل والقطار الخفيف</p>
        </div>
        <div style="width:34px; height:34px; border:3px solid rgba(220,38,38,0.2); border-top-color:#DC2626; border-radius:50%; animation:spin 0.7s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => {
              reg.update();
            })
            .catch(err => console.log('SW error:', err));
        });
      }
    </script>
  </body>
</html>
